# Keeps the Supabase free plan from pausing (it pauses after a week with no
# activity): a tiny database query every Monday and Thursday.
# Uses the same SUPABASE_DB_URL secret as the nightly backup.

name: Keep database awake

on:
  schedule:
    - cron: "0 15 * * 1,4" # Mondays and Thursdays, 15:00 UTC (10 AM Chicago in summer)
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Query the database
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          if [ -z "$SUPABASE_DB_URL" ]; then
            echo "Add the SUPABASE_DB_URL secret in Settings > Secrets and variables > Actions."
            exit 1
          fi
          command -v psql >/dev/null || (sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client)
          psql "$SUPABASE_DB_URL" -tAc "select count(*) from public.profiles" > /dev/null
          echo "Database is awake."
