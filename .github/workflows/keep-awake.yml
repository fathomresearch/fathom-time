# Keeps Fathom Time running with nobody watching it:
# 1. Supabase's free plan pauses a project after a week with no activity,
#    so this runs a tiny database query every Monday and Thursday.
# 2. GitHub turns off scheduled jobs in a public repo after 60 days with no
#    repository activity, so each run turns this job and the backup back on,
#    and about once a month saves a one-line note (the date) to a separate
#    branch, "keepalive". That branch holds only that note: it never touches
#    main or the website, and needs no pull before your own pushes.
# Uses the same SUPABASE_DB_URL secret as the weekly backup.

name: Keep database awake

on:
  schedule:
    - cron: "0 15 * * 1,4" # Mondays and Thursdays, 15:00 UTC (10 AM Chicago in summer)
  workflow_dispatch:

permissions:
  actions: write # keep the scheduled jobs turned on
  contents: write # the monthly note on the keepalive branch

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Query the database
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          if [ -z "$SUPABASE_DB_URL" ]; then
            echo "Add the SUPABASE_DB_URL secret in Settings > Secrets and variables > Actions."
            exit 1
          fi
          command -v psql >/dev/null || (sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client)
          psql "$SUPABASE_DB_URL" -tAc "select count(*) from public.profiles" > /dev/null
          echo "Database is awake."

      - name: Keep the scheduled jobs turned on
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow enable keep-awake.yml --repo "$GITHUB_REPOSITORY"
          gh workflow enable backup.yml --repo "$GITHUB_REPOSITORY"

      - name: Monthly note on the keepalive branch
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git init -q keepalive && cd keepalive
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          if git fetch -q --depth 1 origin keepalive 2>/dev/null; then
            git checkout -q -b keepalive FETCH_HEAD
            last=$(git log -1 --format=%ct)
          else
            git checkout -q --orphan keepalive
            last=0
          fi
          if [ $(( $(date +%s) - last )) -lt $(( 25 * 86400 )) ]; then
            echo "Last note was under 25 days ago; nothing to do."
            exit 0
          fi
          date -u +%F > last-run.txt
          git add last-run.txt
          git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -qm "Keep scheduled jobs alive ($(date -u +%F))"
          git push -q origin keepalive
          echo "Saved the monthly note."
