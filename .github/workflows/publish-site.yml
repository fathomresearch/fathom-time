# Builds the website as plain files and publishes them with GitHub Pages at
# https://time.fathomresearch.ai (custom domain set in Settings > Pages;
# GoDaddy CNAME time -> fathomresearch.github.io).
#
# Repo secrets needed (Settings > Secrets and variables > Actions):
#   NEXT_PUBLIC_SUPABASE_URL       same as .env.local
#   NEXT_PUBLIC_SUPABASE_ANON_KEY  same as .env.local (the publishable key, not the secret key)
# Settings > Pages > Source must be "GitHub Actions".

name: Publish site

on:
  push:
    branches: [main]
    paths-ignore: # notes and database files don't change the website
      - "**.md"
      - "supabase/**"
      - ".github/workflows/backup.yml"
      - ".github/workflows/keep-awake.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check the secrets are set
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
        run: |
          missing=""
          for v in NEXT_PUBLIC_SUPABASE_URL NEXT_PUBLIC_SUPABASE_ANON_KEY; do
            [ -z "${!v}" ] && missing="$missing $v"
          done
          if [ -n "$missing" ]; then
            echo "Add these secrets in Settings > Secrets and variables > Actions:$missing"
            exit 1
          fi

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
        run: |
          npm run build
          touch out/.nojekyll # serve folders that start with "_" (Next.js puts its files in _next)

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
